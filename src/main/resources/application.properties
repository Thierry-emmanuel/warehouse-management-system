spring.application.name=warehouse-management-system

# Database Configuration (Defaults to H2 for self-contained execution; toggle to PostgreSQL as needed)
spring.datasource.url=jdbc:h2:mem:warehousedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

# H2 Console Configuration (Dev mode)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Server Configuration
server.port=8080
server.error.include-message=always