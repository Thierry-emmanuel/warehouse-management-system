<header class="wms-header">
  <!-- Left: Page Title & Context -->
  <div class="header-left">
    <div class="breadcrumb-trail">
      <span class="breadcrumb-item">Platform Administration</span>
      <span class="breadcrumb-separator">/</span>
      <span class="breadcrumb-active">System Overview & RBAC Hub</span>
    </div>
  </div>

  <!-- Right: Facility Selector, System Health, Search, Actions -->
  <div class="header-right">
    <!-- Facility Selector -->
    <div class="facility-badge">
      <svg class="facility-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5" />
      </svg>
      <span class="facility-name">{{ selectedFacility }}</span>
    </div>

    <!-- Health Status Pill -->
    <div class="system-status-pill">
      <span class="pulse-indicator"></span>
      <span class="status-text">Engine Operational</span>
    </div>

    <!-- Refresh Action Button -->
    <button class="action-icon-btn" (click)="onRefresh()" title="Refresh Data">
      <svg class="action-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    </button>
  </div>
</header>
