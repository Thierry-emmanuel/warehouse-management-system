@if (isOpen) {
  <div class="modal-backdrop" (click)="onClose()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title">Create Dynamic Domain Role</h3>
        <button class="btn-close" (click)="onClose()">✕</button>
      </div>

      <form (ngSubmit)="onSubmit()" class="modal-form">
        <div class="form-group">
          <label class="form-lbl">Role Identifier Code (e.g. ROLE_SUPERVISOR) *</label>
          <input type="text" class="form-input font-mono" [(ngModel)]="roleName" name="roleName" required />
        </div>

        <div class="form-group">
          <label class="form-lbl">Role Description & Business Scope</label>
          <textarea class="form-textarea" [(ngModel)]="roleDescription" name="roleDescription" rows="2"></textarea>
        </div>

        <div class="permissions-select-section">
          <label class="form-lbl">Select Action Privileges ({{ selectedPermissionIds.length }} Selected)</label>
          <div class="permissions-grid">
            @for (p of permissions; track p.id) {
              <label class="perm-card" [class.selected]="selectedPermissionIds.includes(p.id)">
                <input type="checkbox" [checked]="selectedPermissionIds.includes(p.id)" (change)="togglePermission(p.id)" />
                <div class="perm-meta">
                  <span class="perm-name font-mono">{{ p.name }}</span>
                  <span class="perm-desc">{{ p.description }}</span>
                </div>
              </label>
            }
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-cancel" (click)="onClose()">Cancel</button>
          <button type="submit" class="btn-save">Create Role</button>
        </div>
      </form>
    </div>
  </div>
}
