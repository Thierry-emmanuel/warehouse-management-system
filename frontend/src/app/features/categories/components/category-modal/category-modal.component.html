@if (isOpen) {
  <div class="modal-backdrop" (click)="onClose()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title">Create SKU Master Category</h3>
        <button class="btn-close" (click)="onClose()">✕</button>
      </div>

      <form (ngSubmit)="onSubmit()" class="modal-form">
        <div class="form-group">
          <label class="form-lbl">Category Classification Name *</label>
          <input type="text" class="form-input" [(ngModel)]="name" name="name" required />
        </div>

        <div class="form-group">
          <label class="form-lbl">Category Unique Code (e.g. ELEC-01) *</label>
          <input type="text" class="form-input font-mono" [(ngModel)]="code" name="code" required />
        </div>

        <div class="form-group">
          <label class="form-lbl">Parent Category (Optional for Tree Nesting)</label>
          <select class="form-input" [(ngModel)]="parentId" name="parentId">
            <option [ngValue]="null">-- Top-Level Root Category --</option>
            @for (cat of categories; track cat.id) {
              <option [ngValue]="cat.id">{{ cat.name }} ({{ cat.code }})</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label class="form-lbl">Classification Scope & Description</label>
          <textarea class="form-textarea" [(ngModel)]="description" name="description" rows="2"></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-cancel" (click)="onClose()">Cancel</button>
          <button type="submit" class="btn-save">Create Category</button>
        </div>
      </form>
    </div>
  </div>
}
