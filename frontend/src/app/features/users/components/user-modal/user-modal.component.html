@if (isOpen) {
  <div class="modal-backdrop" (click)="onClose()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title">Provision New Operator / User</h3>
        <button class="btn-close" (click)="onClose()">✕</button>
      </div>

      <form (ngSubmit)="onSubmit()" class="modal-form">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-lbl">Username *</label>
            <input type="text" class="form-input" [(ngModel)]="formData.username" name="username" required />
          </div>

          <div class="form-group">
            <label class="form-lbl">Full Name *</label>
            <input type="text" class="form-input" [(ngModel)]="formData.fullName" name="fullName" required />
          </div>

          <div class="form-group">
            <label class="form-lbl">Work Email *</label>
            <input type="email" class="form-input" [(ngModel)]="formData.email" name="email" required />
          </div>

          <div class="form-group">
            <label class="form-lbl">Temporary Password *</label>
            <input type="password" class="form-input" [(ngModel)]="formData.password" name="password" required />
          </div>

          <div class="form-group">
            <label class="form-lbl">Facility Node *</label>
            <select class="form-input" [(ngModel)]="formData.warehouseId" name="warehouseId">
              <option [value]="1">WH-MAIN-01 (Central Logistics)</option>
              <option [value]="2">WH-NORTH-02 (Cold Storage)</option>
              <option [value]="3">WH-EAST-03 (Regional Transit)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-lbl">Phone Contact</label>
            <input type="text" class="form-input" [(ngModel)]="formData.phoneNumber" name="phoneNumber" />
          </div>
        </div>

        <div class="roles-selection-block">
          <label class="form-lbl">Assign Dynamic Roles</label>
          <div class="role-checkboxes">
            @for (role of availableRoles; track role.id) {
              <label class="role-chip" [class.selected]="formData.roleIds.includes(role.id)">
                <input type="checkbox" [checked]="formData.roleIds.includes(role.id)" (change)="toggleRole(role.id)" />
                <span>{{ role.name }}</span>
              </label>
            }
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-cancel" (click)="onClose()">Cancel</button>
          <button type="submit" class="btn-save">Create Operator</button>
        </div>
      </form>
    </div>
  </div>
}
