<div class="dashboard-page">
  <!-- Error Alert Banner -->
  @if (errorMessage()) {
    <div class="error-banner">
      <div class="error-content">
        <svg class="error-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <div class="error-text">
          <span class="error-title">Backend Connection Alert</span>
          <span class="error-msg">{{ errorMessage() }}</span>
        </div>
      </div>
      <button class="btn-retry" (click)="initLiveDashboard()">Retry Live Connection</button>
    </div>
  }

  <!-- Top Action & Context Header -->
  <div class="page-top-bar">
    <div class="top-titles">
      <div class="facility-context-pill">
        <span class="live-pulse-dot"></span>
        <span class="facility-id">{{ dashboardData()?.facilityStatus?.facilityCode || 'FACILITY WH-MAIN-01' }}</span>
      </div>
      <h1 class="page-title">Enterprise Supply Chain & Logistics Hub</h1>
      <p class="page-subtitle">Central live telemetry from PostgreSQL • Role allocations & security policies</p>
    </div>

    <div class="top-actions">
      <button class="btn-secondary" (click)="initLiveDashboard()">
        <svg class="btn-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span>Sync Telemetry</span>
      </button>

      <a routerLink="/users" class="btn-primary">
        <svg class="btn-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
        <span>+ Provision Staff</span>
      </a>
    </div>
  </div>

  <!-- SECTION 1: Top 4 KPI Summary Cards with Live Metrics (LogistiQ Standard) -->
  <app-admin-metrics-row [data]="dashboardData()"></app-admin-metrics-row>

  <!-- SECTION 2: 2-Column Analytics (Movement Heatmap & Throughput Chart) -->
  <div class="analytics-row-grid">
    <div class="col-heatmap">
      <app-admin-activity-heatmap></app-admin-activity-heatmap>
    </div>
    <div class="col-chart">
      <app-admin-trend-chart></app-admin-trend-chart>
    </div>
  </div>

  <!-- SECTION 3: High-Bay Warehouse Rack & Bin Visualizer (Real Inventory Balances) -->
  <app-admin-rack-visualizer></app-admin-rack-visualizer>

  <!-- SECTION 4: Staff Role Distribution & Dynamic RBAC (Live from DB) -->
  <app-admin-role-distribution
    [distribution]="dashboardData()?.userRoleDistribution ?? null"
    [totalUsers]="dashboardData()?.totalUsers ?? 0"
  ></app-admin-role-distribution>

  <!-- SECTION 5: Industrial Multi-Select Data Table (Live Registered Users & Operators) -->
  <app-admin-user-table
    [users]="users()"
    [totalUsers]="totalUsers()"
    [isLoading]="isLoading()"
    (search)="onUserSearch($event)"
    (toggleStatus)="onToggleUserStatus($event)"
  ></app-admin-user-table>

  <!-- SECTION 6: IoT Gateway Mesh & Database Health -->
  <app-admin-system-health
    [facilityStatus]="dashboardData()?.facilityStatus ?? null"
    [systemHealth]="dashboardData()?.systemHealth ?? null"
  ></app-admin-system-health>
</div>
