<div class="dashboard-page">
  <!-- Page Hero Title -->
  <div class="page-hero">
    <div class="hero-text">
      <h1 class="hero-title">Platform Administration & RBAC Hub</h1>
      <p class="hero-subtitle">Facility isolation, operator directory, and fine-grained security policies</p>
    </div>

    <div class="hero-actions">
      <button class="btn-secondary" (click)="loadDashboardData()">
        <svg class="btn-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span>Sync Telemetry</span>
      </button>
      <button class="btn-primary">
        <svg class="btn-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
        <span>Audit Logs</span>
      </button>
    </div>
  </div>

  <!-- Row 1: KPI Top Metric Cards with Sparklines -->
  <app-admin-metrics-row [data]="dashboardData()"></app-admin-metrics-row>

  <!-- Row 2: Role Allocation & Permission Matrix -->
  <app-admin-role-distribution [distribution]="dashboardData()?.userRoleDistribution ?? null"></app-admin-role-distribution>

  <!-- Row 3: Dense User & Operator Table -->
  <app-admin-user-table
    [users]="users()"
    [totalUsers]="totalUsers()"
    [isLoading]="isLoading()"
    (search)="onSearchUsers($event)"
    (toggleStatus)="onToggleUserStatus($event)"
  ></app-admin-user-table>

  <!-- Row 4: IoT Gateways & Engine Health -->
  <app-admin-system-health
    [facilityStatus]="dashboardData()?.facilityStatus ?? null"
    [systemHealth]="dashboardData()?.systemHealth ?? null"
  ></app-admin-system-health>
</div>
