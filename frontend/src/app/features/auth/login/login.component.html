<div class="auth-wrapper">
  <div class="auth-card">
    <!-- Brand Header -->
    <div class="auth-header">
      <div class="brand-badge">
        <svg class="brand-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
      </div>
      <div class="header-titles">
        <h1 class="brand-title">LogistiQ WMS</h1>
        <p class="brand-subtitle">Enterprise Supply Chain & Facility Management</p>
      </div>
    </div>

    <!-- Error Banner -->
    @if (errorMessage()) {
      <div class="error-banner">
        <svg class="error-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="error-text">{{ errorMessage() }}</span>
      </div>
    }

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="username">Operator Username or Email</label>
        <input
          type="text"
          id="username"
          class="form-input"
          placeholder="e.g. admin, manager, employee"
          [(ngModel)]="username"
          name="username"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Security Password</label>
        <input
          type="password"
          id="password"
          class="form-input"
          placeholder="••••••••••••"
          [(ngModel)]="password"
          name="password"
          required
          autocomplete="current-password"
        />
      </div>

      <div class="form-options">
        <label class="remember-check">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
          <span>Keep session active</span>
        </label>
        <span class="facility-tag font-mono">WH-MAIN-01</span>
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="spinner"></span>
          <span>Authenticating Operator...</span>
        } @else {
          <span>Authenticate & Access Terminal</span>
        }
      </button>
    </form>

    <!-- Quick Demo Accounts Selector -->
    <div class="demo-section">
      <span class="demo-label">FAST DEMO SEED CREDENTIALS</span>
      <div class="demo-grid">
        @for (demo of demoAccounts; track demo.user) {
          <button type="button" class="demo-chip" (click)="fillDemo(demo.user, demo.pass)">
            <span class="chip-role">{{ demo.role }}</span>
            <span class="chip-user font-mono">{{ demo.user }}</span>
          </button>
        }
      </div>
    </div>

    <!-- Footer Links -->
    <div class="auth-footer">
      <span>New operator on shift?</span>
      <a routerLink="/register" class="link-register">Register Operator Account</a>
    </div>
  </div>
</div>
